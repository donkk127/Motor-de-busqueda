<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Buscador de claves de transmisión</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 24px auto; }
    label { display:block; margin-top:12px; }
    select, input { width: 100%; padding:8px; margin-top:4px; }
    button { margin-top:16px; padding:10px 16px; }
    .resultado { margin-top:18px; padding:12px; border:1px solid #ddd; background:#f9f9f9; }
  </style>
</head>
<body>
  <h2>Buscador de claves de transmisiones</h2>

  <label>Agencia
    <select id="agencia">
      <option value="">-- cualquiera --</option>
    </select>
  </label>

  <label>Nombre (modelo)
    <select id="nombre">
      <option value="">-- cualquiera --</option>
    </select>
  </label>

  <label>Cambios
    <select id="cambios">
      <option value="">-- cualquiera --</option>
    </select>
  </label>

  <label>Año
    <input id="año" type="number" min="1900" max="2100" placeholder="Ej. 2004" />
  </label>

  <label>Cantidad de cilindros
    <select id="cilindros">
      <option value="">-- cualquiera --</option>
    </select>
  </label>

  <label>Motor (litros)
    <select id="motor">
      <option value="">-- cualquiera --</option>
    </select>
  </label>

  <button id="buscar">Buscar clave</button>

  <div id="resultados"></div>

  <script src="motorL.js"></script>
 

</body>
</html>
